<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1216"/><stop offset="1" stop-color="#14110f"/></linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b1a24"/><stop offset=".6" stop-color="#2a2420"/><stop offset="1" stop-color="#8a6a22"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#23364a"/><stop offset=".55" stop-color="#2a2420"/><stop offset="1" stop-color="#7a2a1e"/></linearGradient>
    <linearGradient id="ic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8f1c2c"/><stop offset="1" stop-color="#5c1220"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="900" height="500" rx="18" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="90" y="60" width="720" height="380" rx="14" fill="#221d19" stroke="#342c26"/>
    <!-- title bar -->
    <circle cx="112" cy="80" r="6" fill="#ff5f57"/><circle cx="132" cy="80" r="6" fill="#febc2e"/><circle cx="152" cy="80" r="6" fill="#28c840"/>
    <text x="176" y="85" fill="#a99f92" font-size="13" font-weight="600">kegPlay</text>
    <line x1="90" y1="100" x2="810" y2="100" stroke="#342c26"/>
    <!-- header -->
    <rect x="112" y="116" width="40" height="40" rx="10" fill="url(#ic)"/>
    <rect x="122" y="125" width="20" height="22" rx="5" fill="#e7c98b"/><rect x="121" y="129" width="22" height="2.4" fill="#6b4a1f"/><rect x="121" y="141" width="22" height="2.4" fill="#6b4a1f"/>
    <path d="M129 132.5 L137 136 L129 139.5 Z" fill="#8f1c2c"/>
    <text x="164" y="134" fill="#f3ece2" font-size="18" font-weight="700">kegPlay</text>
    <text x="164" y="151" fill="#a99f92" font-size="11.5">Play Windows (Steam) games on Mac · version 0.1.7</text>
    <rect x="712" y="124" width="78" height="24" rx="12" fill="#6cc48b" fill-opacity=".16"/><circle cx="727" cy="136" r="4" fill="#6cc48b"/><text x="737" y="140" fill="#6cc48b" font-size="12">Ready</text>
    <line x1="90" y1="172" x2="810" y2="172" stroke="#342c26"/>
    <!-- controls -->
    <rect x="112" y="184" width="214" height="26" rx="7" fill="none" stroke="#342c26"/><rect x="113" y="185" width="140" height="24" rx="6" fill="#1c1815"/>
    <text x="126" y="201" fill="#f3ece2" font-size="12">DXMT (recommended)</text><text x="272" y="201" fill="#a99f92" font-size="12">DXVK</text>
    <rect x="340" y="184" width="108" height="26" rx="7" fill="#b5283a"/><text x="356" y="201" fill="#fff" font-size="12" font-weight="600">▶  Open Steam</text>
    <rect x="460" y="184" width="104" height="26" rx="7" fill="none" stroke="#342c26"/><text x="476" y="201" fill="#f3ece2" font-size="12">■  Stop Steam</text>
    <text x="660" y="201" fill="#a99f92" font-size="12">Unblock Store</text><rect x="752" y="187" width="38" height="20" rx="10" fill="#b5283a"/><circle cx="780" cy="197" r="8" fill="#fff"/>
    <line x1="90" y1="222" x2="810" y2="222" stroke="#342c26"/>
    <!-- game cards -->
    <rect x="112" y="238" width="290" height="150" rx="10" fill="#1c1815" stroke="#342c26"/><rect x="113" y="239" width="288" height="100" rx="9" fill="url(#g1)"/>
    <text x="124" y="364" fill="#f3ece2" font-size="12.5" font-weight="700">Kingdom Come: Deliverance</text><text x="124" y="379" fill="#a99f92" font-size="10.5">64.8 GB</text>
    <rect x="342" y="354" width="50" height="22" rx="6" fill="#b5283a"/><text x="351" y="369" fill="#fff" font-size="11" font-weight="600">▶ Play</text>
    <rect x="416" y="238" width="290" height="150" rx="10" fill="#1c1815" stroke="#342c26"/><rect x="417" y="239" width="288" height="100" rx="9" fill="url(#g2)"/>
    <text x="428" y="364" fill="#f3ece2" font-size="12.5" font-weight="700">Mount &amp; Blade II: Bannerlord</text><text x="428" y="379" fill="#a99f92" font-size="10.5">64.0 GB</text>
    <rect x="646" y="354" width="50" height="22" rx="6" fill="#b5283a"/><text x="655" y="369" fill="#fff" font-size="11" font-weight="600">▶ Play</text>
    <!-- footer -->
    <line x1="90" y1="408" x2="810" y2="408" stroke="#342c26"/>
    <text x="112" y="428" fill="#a99f92" font-size="11">Offline games using DirectX 9/10/11.</text>
    <text x="788" y="428" fill="#6aa5ff" font-size="11" text-anchor="end">Troubleshooting  ·  Log  ·  Settings</text>
